# 前端: nginx Deployment + Service (托管 vite 静态产物).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: platform-system
spec:
  replicas: 2   # nginx 托管静态产物, 无状态, 多副本安全 (容错 + 分担)
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        role: platform
      containers:
      - name: nginx
        image: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/<PROJECT>-frontend:<TAG>
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "200m", memory: "256Mi" }
        readinessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 3
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: platform-system
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
