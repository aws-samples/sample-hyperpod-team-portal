[project]
name = "platform-worker"
version = "0.1.0"
description = "HyperPod UI Platform · K8s informer worker (CR → DDB)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "platform-api",
    "kubernetes-asyncio>=32.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.uv.sources]
platform-api = { path = "../platform-api", editable = true }
