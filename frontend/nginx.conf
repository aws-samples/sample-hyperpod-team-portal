# nginx 托管 vite 静态产物 (SPA).
# /api/* 不在这里代理 —— 由 ALB Ingress 直接路由到后端 service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由: 找不到文件回退 index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存 (vite 产物带 hash, 可 immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
