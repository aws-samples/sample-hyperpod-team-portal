<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0958d9" />
      <stop offset="100%" stop-color="#13c2c2" />
    </linearGradient>
    <linearGradient id="hp-fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6f4ff" />
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#hp-bg)" />
  <!-- Abstract "H" formed as a GPU grid: two vertical bars + crossbar + 4 corner nodes -->
  <rect x="16" y="16" width="5" height="32" rx="2.5" fill="url(#hp-fg)" opacity="0.95" />
  <rect x="43" y="16" width="5" height="32" rx="2.5" fill="url(#hp-fg)" opacity="0.95" />
  <rect x="16" y="29.5" width="32" height="5" rx="2.5" fill="url(#hp-fg)" opacity="0.85" />
  <!-- GPU node dots at corners -->
  <circle cx="18.5" cy="18.5" r="2.2" fill="#ffffff" />
  <circle cx="45.5" cy="18.5" r="2.2" fill="#ffffff" />
  <circle cx="18.5" cy="45.5" r="2.2" fill="#ffffff" />
  <circle cx="45.5" cy="45.5" r="2.2" fill="#ffffff" />
</svg>
